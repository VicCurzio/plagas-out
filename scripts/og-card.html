<!doctype html>
<!--
  Fuente de la placa que se comparte (public/og.jpg). La renderiza
  scripts/build-og.mjs; no se publica, no entra al sitio.

  Los colores salen de src/index.css, con los mismos valores en oklch, y la
  tipografia es la misma Manrope del sitio: la tarjeta tiene que parecerse a
  la pagina a la que lleva.

  El texto es el del sitio y no texto nuevo: la habilitacion, el nombre, la
  linea de las tres ciudades y los tres numeros, todo sale de Hero.tsx. Si
  cambia el hero, cambia esto.
-->
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: oklch(0.97 0.014 66);
    --orange: oklch(0.70 0.19 41);
    --navy: oklch(0.19 0.035 262);
    --navy-border: oklch(0.32 0.03 262);
    --navy-muted: oklch(0.74 0.03 262);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:var(--navy);font-family:Manrope,sans-serif;color:var(--cream);
       display:flex;flex-direction:column;justify-content:center;padding:0 88px;position:relative;overflow:hidden}
  .glow{position:absolute;width:820px;height:820px;right:-280px;top:-260px;border-radius:50%;
        background:radial-gradient(circle, oklch(0.70 0.19 41 / 0.22) 0%, transparent 62%)}
  .badge{display:inline-flex;align-items:center;gap:12px;align-self:flex-start;
         border:1px solid var(--navy-border);border-radius:999px;padding:11px 22px;
         font-size:19px;font-weight:700;letter-spacing:.09em;color:var(--navy-muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--orange)}
  h1{font-size:104px;font-weight:800;line-height:1;margin-top:34px;letter-spacing:-.025em}
  .o{color:var(--orange)}
  .sub{font-size:46px;font-weight:600;color:var(--navy-muted);margin-top:10px;letter-spacing:-.01em}
  .lead{font-size:29px;font-weight:500;color:var(--navy-muted);margin-top:30px;max-width:900px;line-height:1.45}
  .lead strong{color:var(--cream);font-weight:700}
  .stats{display:flex;gap:56px;margin-top:44px;padding-top:30px;border-top:1px solid var(--navy-border)}
  .v{font-size:38px;font-weight:800}
  .v.acc{color:var(--orange)}
  .l{font-size:19px;font-weight:500;color:var(--navy-muted);margin-top:4px}
  .mark{position:absolute;right:88px;top:84px;width:116px;height:116px;border-radius:28px;
        background:var(--orange);display:flex;align-items:center;justify-content:center;
        font-size:70px;font-weight:800;color:#fff}
</style></head>
<body>
  <div class="glow"></div>
  <div class="badge"><span class="dot"></span>HABILITACIÓN OFICIAL · LEY 10.699</div>
  <h1>Plagas<span class="o">Out</span></h1>
  <div class="sub">Control Urbano</div>
  <p class="lead">Fumigación profesional y sanitaria en<br><strong>La Plata, Berisso y Ensenada</strong>.</p>
  <div class="stats">
    <div><div class="v acc">24h</div><div class="l">Respuesta rápida</div></div>
    <div><div class="v">+15</div><div class="l">Años de experiencia</div></div>
    <div><div class="v">100%</div><div class="l">Garantía sanitaria</div></div>
  </div>
  <div class="mark">P</div>
</body></html>
